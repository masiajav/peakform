<svg xmlns="http://www.w3.org/2000/svg" width="400" height="380" viewBox="0 0 400 380" role="img" aria-labelledby="dive-title dive-desc">
  <title id="dive-title">Dive: llegar juntos</title>
  <desc id="dive-desc">Esquema conceptual del mismo cruce y las mismas coberturas. Sigma y Ashe siguen a la izquierda. Winston parte a la derecha de una cobertura, la rodea por abajo con una ruta curva y salta hasta una posición cercana a Ashe. Tracer entra por el lateral inferior al mismo tiempo. Dos flechas cortas indican presión sobre Ashe desde direcciones distintas; no representan daño ni una baja asegurada.</desc>
  <defs>
    <pattern id="dive-cover" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#353b30"/>
      <path d="M0 0V8" stroke="#65705b" stroke-width="2"/>
    </pattern>
    <marker id="dive-route-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#ff8d52" stroke-width="1.5"/>
    </marker>
    <marker id="dive-pressure-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#f1f4eb" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="400" height="380" rx="16" fill="#0a0a0a"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="22" y="33" fill="#f1f4eb" font-size="22" font-weight="700">Dive: llegar juntos</text>
    <text x="22" y="58" fill="#c5d99b" font-size="16">Sigma + Ashe</text>
    <text x="378" y="58" text-anchor="end" fill="#ff8d52" font-size="16">Winston + Tracer</text>
    <rect x="17" y="73" width="366" height="234" rx="10" fill="#151811" stroke="#414937"/>
    <path d="M18 207H382V261H18Z" fill="#252b1f"/>
    <path d="M211 74H255V306H211Z" fill="#252b1f"/>
    <text x="233" y="117" text-anchor="middle" fill="#a7b299" font-size="16">Cruce</text>
    <g fill="url(#dive-cover)" stroke="#89937e" stroke-width="1.5">
      <rect x="95" y="145" width="49" height="60" rx="3"/>
      <rect x="40" y="264" width="104" height="17" rx="3"/>
      <rect x="269" y="102" width="27" height="96" rx="3"/>
    </g>
    <path d="M334 143V215Q334 250 302 250H259" fill="none" stroke="#ff8d52" stroke-width="3" stroke-linecap="round"/>
    <path d="M259 250Q227 171 191 207" fill="none" stroke="#ff8d52" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" marker-end="url(#dive-route-arrow)"/>
    <text x="218" y="171" text-anchor="middle" fill="#ff8d52" font-size="16" font-weight="700">Salto</text>
    <path d="M345 287H241Q214 287 202 277" fill="none" stroke="#ff8d52" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
    <text x="243" y="282" fill="#ff8d52" font-size="16">Lateral</text>
    <g fill="none" stroke="#f1f4eb" stroke-width="2.5" marker-end="url(#dive-pressure-arrow)">
      <path d="M164 220L105 236"/>
      <path d="M175 267L104 250"/>
    </g>
    <g fill="#151811" stroke="#c5d99b" stroke-width="3">
      <circle cx="111" cy="125" r="14"/>
      <circle cx="80" cy="244" r="14"/>
    </g>
    <g fill="#c5d99b" font-size="17" font-weight="700">
      <text x="32" y="131">Sigma</text>
      <text x="42" y="220">Ashe</text>
    </g>
    <circle cx="334" cy="128" r="14" fill="#151811" stroke="#ff8d52" stroke-width="2" stroke-dasharray="3 4"/>
    <text x="334" y="98" text-anchor="middle" fill="#ff8d52" font-size="16">Inicio</text>
    <g fill="#151811" stroke="#ff8d52" stroke-width="3">
      <circle cx="178" cy="213" r="14"/>
      <circle cx="189" cy="271" r="14"/>
    </g>
    <g fill="#ff8d52" font-size="17" font-weight="700">
      <text x="185" y="189" text-anchor="middle">Winston</text>
      <text x="189" y="302" text-anchor="middle">Tracer</text>
    </g>
    <g font-size="16" fill="#dce3d3">
      <path d="M24 332H52" stroke="#ff8d52" stroke-width="3"/>
      <text x="61" y="338">Ruta</text>
      <path d="M121 332H149" stroke="#ff8d52" stroke-width="3" stroke-dasharray="7 6"/>
      <text x="158" y="338">Salto</text>
      <path d="M225 332H253" stroke="#f1f4eb" stroke-width="2.5" marker-end="url(#dive-pressure-arrow)"/>
      <text x="266" y="338">Presión</text>
      <text x="24" y="363">Dos direcciones sobre Ashe.</text>
    </g>
  </g>
</svg>
