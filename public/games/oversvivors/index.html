<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Oversvivors · Replaid Lab</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080f17; color: #e8f3ef; font-family: system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; padding: 32px; background: radial-gradient(ellipse at center, #12302e, #080f17 70%); text-align: center; }
    #loading[hidden] { display: none; }
    .label { color: #ffa26a; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 6vw, 56px); letter-spacing: .07em; margin: 0; }
    #status { max-width: 480px; margin: 0; color: #a4bcb9; font-size: 14px; line-height: 1.6; }
    progress { width: 100%; height: 4px; border: 0; accent-color: #6be4ce; }
    progress::-webkit-progress-bar { background: #213537; }
    progress::-webkit-progress-value { background: #6be4ce; }
    #retry { color: #080f17; background: #6be4ce; border: 0; padding: 12px 18px; cursor: pointer; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="robots" content="noindex">
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Oversvivors. Usa WASD o las flechas para moverte, Shift y E para habilidades, Q para la definitiva y Escape para pausar.">Tu navegador necesita WebGL 2 para jugar.</canvas>
  <div id="loading" role="status" aria-live="polite">
    <span class="label">Replaid Lab / Arcade</span>
    <h1>OVERSVIVORS</h1>
    <p id="status">Preparando la arena… La primera carga puede tardar unos segundos.</p>
    <progress id="progress" aria-label="Descarga del juego"></progress>
    <button id="retry" hidden onclick="location.reload()">Volver a intentar</button>
  </div>
  <script src="index.js"></script>
  <script>
    const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1845784,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const canvas = document.getElementById('canvas');
    const send = (type, detail = {}) => {
      if (window.parent !== window) window.parent.postMessage({ source: 'oversvivors', type, ...detail }, window.location.origin);
    };
    let ready = false;
    window.addEventListener('message', event => {
      if (event.origin === window.location.origin && event.source === window.parent && event.data?.source === 'replaidlab' && event.data.type === 'status' && ready) send('ready');
    });
    const fail = error => {
      console.error(error);
      document.getElementById('status').textContent = 'No se ha podido iniciar el juego. Comprueba que tu navegador permite WebGL 2 y vuelve a intentarlo.';
      document.getElementById('retry').hidden = false;
      progress.hidden = true;
      send('error');
    };
    const missing = Engine.getMissingFeatures({ threads: false });
    if (missing.length) {
      fail(missing.join(', '));
    } else {
      engine.startGame({
        canvas,
        onProgress: (current, total) => {
          if (total > 0) { progress.max = total; progress.value = current; }
        },
        onExit: () => { loading.hidden = false; document.getElementById('status').textContent = 'La sesión ha terminado. Recarga para volver a jugar.'; progress.hidden = true; document.getElementById('retry').hidden = false; },
      }).then(() => { ready = true; loading.hidden = true; canvas.focus(); send('ready'); }, fail);
    }
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
